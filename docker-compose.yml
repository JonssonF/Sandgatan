services:
  api:
    build:
      context: .
      dockerfile: Sandgatan.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/app/data/sandgatan.db"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    volumes:
      - sandgatan-data:/app/data
    networks:
      - sandgatan

  web:
    build:
      context: ./sandgatan-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - sandgatan

networks:
  sandgatan:

volumes:
  sandgatan-data:
